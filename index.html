<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beautiful Theme Toggle</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #f0f2f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #1a1a2e;
      transition: background-color 0.6s ease, color 0.6s ease;
    }

    body.dark-mode {
      background-color: #0B0E14;
      color: #e0e0e0;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 2rem;
      letter-spacing: -0.02em;
    }

    /* Size the toggle by sizing its container */
    #toggle-container {
      width: 180px;
    }

    .label {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      opacity: 0.5;
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>

  <h1>Theme Toggle</h1>
  <div id="toggle-container"></div>
  <p class="label">Click the toggle to switch themes</p>

  <script type="module">
    import { ThemeToggle } from './dist/index.js';

    const toggle = new ThemeToggle({
      element: '#toggle-container',
      initialState: 'system',
      onChange: (state) => {
        document.body.classList.toggle('dark-mode', state === 'dark');
      }
    });
  </script>
</body>
</html>
